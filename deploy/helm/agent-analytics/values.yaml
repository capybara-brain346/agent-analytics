# Production runtime (docs/modules/deployment/README.md).

image:
  api: agent-analytics-api:0.1.0        # api, worker and migrate use this image
  dashboard: agent-analytics-dashboard:0.1.0
  pullPolicy: IfNotPresent

api:
  replicas: 2
  resources: {}

worker:
  replicas: 2                           # cap to fit the database connection limit (7.10)
  resources: {}

dashboard:
  replicas: 2
  resources: {}

host: agent-analytics.example.internal

ingress:
  enabled: true
  className: ""                         # the customer's controller
  tlsSecretName: ""
  maxBodySize: 50m

httpRoute:
  enabled: false
  parentRefs: []                        # the customer's Gateway

postgres:
  # CloudNativePG Cluster (operator must be installed in the cluster).
  instances: 2                          # primary + standby, automatic failover
  storageSize: 100Gi
  backup:
    enabled: false
    destinationPath: ""                 # s3://bucket/path
    endpointURL: ""
    credentialsSecret: ""

inbox:
  # The customer's S3-compatible storage, or SeaweedFS.
  endpointURL: ""
  bucket: agent-analytics-inbox
  region: us-east-1

# Secret with S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, API_TOKEN (guards /api/*) and optional OPENROUTER_API_KEY.
# Create it yourself or through External Secrets from the customer's Vault.
existingSecret: agent-analytics

offline: false
logLevel: INFO

# Recommendation text through OpenRouter. OPENROUTER_API_KEY goes in existingSecret.
# Empty model = template text only.
llm:
  model: ""                           # for example anthropic/claude-sonnet-5.5
  baseURL: https://openrouter.ai/api/v1

{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aa.name" . }}
  labels: {{- include "aa.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.host | quote }}]
  rules:
    - matches:
        {{- range list "/ingest" "/api" "/health" "/metrics" }}
        - path: { type: PathPrefix, value: {{ . }} }
        {{- end }}
      backendRefs: [{ name: {{ include "aa.name" . }}-api, port: 8000 }]
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: {{ include "aa.name" . }}-dashboard, port: 3000 }]
{{- end }}

# Migrations before each install and upgrade (alembic upgrade head).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aa.name" . }}-migrate
  labels: {{- include "aa.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true }
      containers:
        - name: migrate
          image: {{ .Values.image.api }}
          command: ["alembic", "upgrade", "head"]
          env: {{- include "aa.apiEnv" . | nindent 12 }}

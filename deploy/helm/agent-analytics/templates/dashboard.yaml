apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aa.name" . }}-dashboard
  labels: {{- include "aa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  strategy: { type: RollingUpdate }
  selector:
    matchLabels: { app.kubernetes.io/component: dashboard, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/component: dashboard, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: dashboard
          image: {{ .Values.image.dashboard }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aa.name" . }}-dashboard
  labels: {{- include "aa.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: dashboard, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 3000, targetPort: http }]
